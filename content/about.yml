title: "About Me"
description: "Learn more about my journey as a Backend & AI Agent Specialist, my development philosophy, and my approach to building reliable infrastructure."
content: |
  Hi, I'm **Hugo Edmoundo**, a Software Engineer focused on backend systems and autonomous AI workflows. I build server-side applications and context engines — things that need to be reliable, efficient, and actually scale without falling apart.

  I've worked on everything from corporate payroll systems to multi-agent AI platforms. Along the way I've learned to care deeply about data integrity, API performance, and automation done right. Good software is just boring infrastructure that never breaks.

  ### My Engineering Philosophy

  I keep things **type-safe**, **modular**, and **efficient**. Whether it's designing database schemas with SQLModel or optimising server performance, I aim for code that's easy to maintain and hard to break. I use Python, FastAPI, and the `uv` package manager because they're fast and get out of my way.

  I'm backend-first, but I make sure my APIs play nice with the frontend — whatever style that frontend uses. Clean data in, clean data out.

  ### What Drives Me

  I'm into **Agentic Workflows** and **Retrieval-Augmented Generation (RAG)** — specifically the challenge of making multi-agent systems actually useful in production. Building tools that parse large datasets and turn complex backend logic into something that just works is what keeps me going.

  ### Beyond the Screen

  When I'm not provisioning VPS instances (mostly Contabo), building AI agents, or wrangling monorepos with `moonrepo`, I'm usually deep in the mechanical keyboard rabbit hole — compact builds, custom peripherals, that sort of thing.

  Feel free to check my [projects](/projects) or [get in touch](/#contact) if you want to talk tech or collaborate on something.
