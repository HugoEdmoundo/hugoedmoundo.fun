title: "About Me"
description: "Learn more about my journey as a Backend & AI Agent Specialist, my development philosophy, and my obsession with high-stakes infrastructure."
content: |
  Hi, I'm **Hugo Edmoundo**, a Software Engineer specialising in robust backend systems and autonomous AI workflows. I spend my time building mental server-side applications and implementing cutting-edge context engines, focusing on creating solutions that are powerful, proper efficient, and incredibly scalable.

  My journey has been fueled by a deep curiosity for what happens behind the terminal. Over the course of my engineering stints—ranging from complex corporate payroll apps to advanced multi-agent systems—I've honed my skills to focus strictly on data integrity, high-performance APIs, and proper automation. I firmly believe that the best software seamlessly marries logical back-end efficiency with secure, bulletproof infrastructure.

  ### My Engineering Philosophy

  My development philosophy is rooted in **extreme efficiency**, **type-safety**, and **modular architecture**. Whether I'm designing complex database schemas with SQLModel or optimising server performance, I always aim for clean, maintainable code. I rely on modern, ultra-fast tools like Python, FastAPI, and the `uv` package manager to keep builds fast and deployment times down. 

  While I'm a backend-first engineer, I still care about the final presentation. I make sure my APIs are architected perfectly to feed data into ultra-modern, "Liquid Glass" (glassmorphism) frontends without a single drop in latency.

  ### What Drives Me

  What keeps me absolutely locked in is the cutting edge of autonomous tech, particularly the evolution of **Agentic Workflows** and **Retrieval-Augmented Generation (RAG)**. I love the challenge of translating complex multi-agent orchestrations into practical tools—like building smart study environments that parse massive datasets dynamically. Turning raw data and complex backend logic into an effortless, intelligent workflow is what excites me most.

  ### Beyond the Screen

  When I'm not configuring root-access VPS infrastructure (mostly tweaking Contabo boxes), building AI agents, or managing monorepos with `moonrepo`, you can usually find me hunting down custom compact mechanical keyboards and high-performance peripheral gear. 

  Cheers for stopping by, mate. Feel free to browse my [projects](/projects) or [get in touch](/#contact) if you fancy a proper technical collaboration!
