about:
  title: "The Lowdown"
  description: |
    I’m a Software Engineer who’s absolutely obsessed with the "behind-the-scenes" magic. While most people focus on the bits they can see, I’m busy architecting mental backend ecosystems and advanced AI-enabled systems that actually scale. 
    
    My bread and butter is engineering intelligent automation and deploying secure, high-stakes infrastructure. I don't just write scripts; I build agentic workflows that think. It’s all about blending logic that's solid as a rock with that creativity.
