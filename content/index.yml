faq:
  title: Bits & Bobs (FAQ)
  description: Everything you need to know about how I work.
  categories:
    - title: Specialism & Stack
      questions:
        - label: What’s your actual niche?
          content: |
            I’m a Backend and AI Agent specialist. Period. I build scalable APIs with FastAPI, handle complex data with SQLModel, and use the `uv` package manager because life is too short for slow builds. I also spend a lot of time in the "Agentic" world—making AI do more than just chat.
        - label: How do you handle AI?
          content: |
            It’s all about the workflows, mate. I build RAG (Retrieval-Augmented Generation) systems that parse massive datasets and multi-agent orchestrations that work together to solve actual business problems.
    - title: Infrastructure
      questions:
        - label: Where do you host?
          content: |
            I’m a fan of direct control. I usually deploy on root-access VPS environments (mostly AWS, IdCloudhost, Sumopod) so I can tweak everything to perfection. I handle the SSL, the domain mapping, and the server orchestration myself. Proper DIY.
    - title: Personality
      questions:
        - label: What’s the vibe outside of work?
          content: |
            I’m a proper gearhead when it comes to hardware. If it’s a compact mechanical keyboard or high-performance peripheral, I’m probably looking at it. I like my setups clean, my code elegant, and my coffee is always in my hand (: ..