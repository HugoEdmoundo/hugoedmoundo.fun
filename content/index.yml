faq:
  title: "Bits & Bobs (FAQ)"
  description: Everything you need to know about how I work.
  categories:
    - title: Specialism & Stack
      questions:
        - label: What's your actual niche?
          content: |
            Backend and AI Agent development. I build scalable APIs with FastAPI, handle data with SQLModel, and use `uv` for package management. A good chunk of my time goes into building agentic systems — making AI do more than just chat.
        - label: How do you handle AI?
          content: |
            It's all about the workflows. I build RAG (Retrieval-Augmented Generation) systems that parse large datasets and multi-agent orchestrations that solve real business problems.
    - title: Infrastructure
      questions:
        - label: Where do you host?
          content: |
            I prefer direct control. I deploy on root-access VPS environments (mostly AWS, IdCloudhost, Sumopod) so I can tweak things as needed. I handle the SSL, domain mapping, and server orchestration myself.
    - title: Personality
      questions:
        - label: What's the vibe outside of work?
          content: |
            I'm into mechanical keyboards and custom peripherals. If it's a compact build or high-performance gear, I'm probably looking at it. Clean setups, clean code, and coffee within arm's reach.
