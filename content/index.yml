about:
  title: "The Lowdown"
  description: |
    I'm a Software Engineer who cares about what happens behind the scenes. While most people focus on the UI, I'm the one architecting backend systems and AI workflows that actually hold up under load.

    I build automation that's reliable and infrastructure that doesn't keep you up at night. It's not just about writing code — it's about building systems you can trust.
