faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my technical process and architectural services.
  categories:
    - title: Services & Technical Stack
      questions:
        - label: What services do you offer?
          content: |
            I specialize in full-stack software engineering, scalable API development, and the implementation of intelligent AI workflows. This includes architecting systems with FastAPI and Next.js, building advanced Retrieval-Augmented Generation (RAG) modules, multi-agent orchestrations, creating premium glassmorphic/parallax user interfaces, and managing deployment operations over dedicated infrastructure.
        - label: What is your primary technical stack?
          content: |
            My go-to ecosystem is centered around performance, modern DX, and strict typing. On the backend, I leverage Python with FastAPI, SQLModel, and SQLite/PostgreSQL, powered by the ultra-fast `uv` package manager. On the frontend, I utilize Next.js and React. I manage multi-tiered projects using `moonrepo` monorepos to guarantee clean boundaries and fast caching.
        - label: What kind of AI integrations do you build?
          content: |
            I design agentic workflows and smart context engines. My core focus lies in building RAG systems capable of parsing complex structures (like PDF documents, manuals, or datasets) to dynamically generate automated evaluations, precise summaries, or multi-turn conversational agents.
    - title: Infrastructure & Workflow
      questions:
        - label: How do you handle application deployment?
          content: |
            I rely on root-access VPS environments (such as Contabo virtual servers) to deploy, configure, and maintain production applications. I secure endpoints with robust SSL certifications, map domains cleanly, and orchestrate server resources directly for optimal resource management and performance.
        - label: Do you build responsive and custom frontends?
          content: |
            Yes. While I ensure backend architectures are sound, I treat user interfaces with premium care. I specialize in building ultra-modern frontends incorporating high-fidelity "Liquid Glass" (glassmorphism) aesthetics and fluid parallax mechanics to elevate standard product presentation.
    - title: About Me
      questions:
        - label: What do you enjoy most about engineering?
          content: |
            I thrive on the puzzle of system optimization and translating cutting-edge tech into concrete, everyday software. Bridging the gap between automated backend processes—like AI-driven data extraction—and clean, ultra-responsive user views is what excites me the most.
        - label: What are your interests outside of coding?
          content: |
            When I'm off the terminal, I'm highly passionate about high-performance tech setups and hardware. I spend time exploring custom compact mechanical keyboards and tracking down premium peripheral gear, or browsing through emerging open-source repositories.